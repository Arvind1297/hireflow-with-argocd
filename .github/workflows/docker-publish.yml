name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: docker-publish-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: devendra-5470

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # Docker Buildx
      # ---------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------------------
      # Login to GitHub Container Registry
      # ---------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Build & Push Backend
      # ---------------------------------------------------------

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------------------------------------------------------
      # Build & Push Frontend
      # ---------------------------------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ---------------------------------------------------------
      # Output published images
      # ---------------------------------------------------------

      - name: Print published images
        run: |
          echo "============================================"
          echo "GHCR IMAGES PUBLISHED"
          echo "============================================"
          echo "Backend:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-backend:${{ github.sha }}"
          echo ""
          echo "Frontend:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-frontend:${{ github.sha }}"
          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"
