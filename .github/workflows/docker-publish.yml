name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-publish-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-backend
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/hireflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Print published images
        run: |
          echo "Backend:  ${{ vars.DOCKERHUB_USERNAME }}/hireflow-backend:${{ github.sha }}"
          echo "Frontend: ${{ vars.DOCKERHUB_USERNAME }}/hireflow-frontend:${{ github.sha }}"
          echo "Latest tags also updated on main."
