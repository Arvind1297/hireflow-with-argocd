<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>HireFlow | Modern Hiring & Recruitment Platform</title>

    <meta
      name="description"
      content="HireFlow is a modern hiring and recruitment platform that helps teams manage candidates, job openings, interviews, and the entire hiring workflow in one place."
    />

    <meta
      name="keywords"
      content="hiring platform, recruitment platform, applicant tracking system, ATS, candidate management, interview management, HR software, recruitment software, hiring software"
    />

    <meta name="author" content="HireFlow" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://hireflow.example.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#070b14" />

    <meta name="color-scheme" content="dark" />

    <!-- Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="HireFlow | Modern Hiring & Recruitment Platform"
    />

    <meta
      property="og:description"
      content="Manage candidates, interviews, job openings, and your entire hiring workflow with HireFlow."
    />

    <meta
      property="og:url"
      content="https://hireflow.example.com/"
    />

    <meta
      property="og:site_name"
      content="HireFlow"
    />

    <meta
      property="og:image"
      content="https://hireflow.example.com/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="HireFlow modern recruitment and hiring platform"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="HireFlow | Modern Hiring & Recruitment Platform"
    />

    <meta
      name="twitter:description"
      content="A modern platform for managing candidates, interviews, job openings, and hiring workflows."
    />

    <meta
      name="twitter:image"
      content="https://hireflow.example.com/og-image.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Web App -->
    <meta
      name="application-name"
      content="HireFlow"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="HireFlow"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "HireFlow",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Recruitment Software",
        "operatingSystem": "Web",
        "description": "HireFlow is a modern hiring and recruitment platform for managing candidates, job openings, interviews, and hiring workflows.",
        "url": "https://hireflow.example.com/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      <div>
        HireFlow requires JavaScript to run. Please enable JavaScript
        in your browser to use the hiring and recruitment platform.
      </div>
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
